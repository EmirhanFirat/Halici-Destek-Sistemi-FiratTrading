services:
  web:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - catalog-data:/data
    restart: unless-stopped
volumes:
  catalog-data:
